<article class="mainContainer">
    <app-sidebar />
        
    <section class="maincontent" [class.mobile]="isSmall">
        <app-top-bar />
        <article class="content">
            <app-welcome />
            
            <div class="cardsContainer">
                @for ( card of cards; track $index){
                    <app-dashboard-card [card]="card" />
                }
            </div>
            <app-task-adder />
            <app-dashboard-nav-bar />
        </article>
        <app-task-container />
        
    </section>
</article>
